<!DOCTYPE html>
<html lang="en" data-version="0.0.1">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <title>Leaf Strenght</title>
        <link rel="stylesheet" href="./css/styles.css">
        <script src="./js/scripts.js" type="module"></script>
    </head>
    <body>
        <div id="loader">Loading...</div>
        <form id="language_buttons" translation="attribute|languages|message">
            <input type="button" id="button_spanish" class="alt" value="Español">
            <input type="button" id="button_english" class="alt" value="English">           
        </form>
        <div id="main_content">
            <form id="your_mesocycles" class="container">
                <h1 translation="text|your_mesocycles" class="center"></h1>
                <ul id="mesocycles_list" translation="attribute|no_mesocycles_yet|message"></ul>
                <input type="button" id="button_new_mesocycle" class="center" translation="value|new_mesocycle">
            </form>
            <form id="new_mesocycle" class="hide container">
                <h1 translation="text|new_mesocycle" class="center"></h1>
                <ul>
                    <li>
                        <label for="new_mesocycle_name" translation="text|mesocycle_name"></label>
                        <input type="text" id="new_mesocycle_name" name="new_mesocycle_name" translation="placeholder|mesocycle_name,title|mesocycle_name" required>
                    </li>
                    <li>
                        <label for="new_mesocycle_objective" translation="text|mesocycle_objective"></label>
                        <select type="text" id="new_mesocycle_objective" name="new_mesocycle_objective" translation="title|mesocycle_objective" required>
                            <option value="" translation="text|mesocycle_objective"></option>
                            <option value="strength" translation="text|mesocycle_objective_strength"></option>
                            <option value="hypertrophy" translation="text|mesocycle_objective_hypertrophy"></option>
                            <option value="endurance" translation="text|mesocycle_objective_endurance"></option>
                            <option value="definition" translation="text|mesocycle_objective_definition"></option>
                            <option value="maintenance" translation="text|mesocycle_objective_maintenance"></option>
                            <option value="bilbo" translation="text|mesocycle_objective_bilbo"></option>
                        </select>
                    </li>
                    <li>
                        <label for="new_mesocycle_structure" translation="text|mesocycle_structure"></label>
                        <select type="text" id="new_mesocycle_structure" name="new_mesocycle_structure" translation="title|mesocycle_structure" required>
                            <option value="" translation="text|mesocycle_structure"></option>
                            <option value="fullbody" translation="text|mesocycle_structure_fullbody"></option>
                            <option value="upper-lower" translation="text|mesocycle_structure_upper-lower"></option>
                            <option value="push-pull-legs" translation="text|mesocycle_structure_push-pull-legs"></option>
                            <option value="weider" translation="text|mesocycle_structure_weider"></option>
                        </select>
                    </li>
                    <li>
                        <label for="new_mesocycle_total_microcycle" translation="text|mesocycle_total_microcycle"></label>
                        <input type="number" id="new_mesocycle_total_microcycle" name="new_mesocycle_total_microcycle" translation="placeholder|mesocycle_total_microcycle,title|mesocycle_total_microcycle_title" required>
                    </li>
                    <li>
                        <label for="new_mesocycle_sessions_microcycle" translation="text|mesocycle_sessions_microcycle"></label>
                        <input type="number" id="new_mesocycle_sessions_microcycle" name="new_mesocycle_sessions_microcycle" translation="placeholder|mesocycle_sessions_microcycle,title|mesocycle_sessions_microcycle_title" required>
                    </li>
                    <!--<li>
                        <input type="number" id="new_mesocycle_time_sessions" name="new_mesocycle_time_sessions" translation="placeholder|mesocycle_time_sessions,title|mesocycle_time_sessions_title" required>
                    </li>-->
                </ul>
                <div class="footer">
                    <input type="button" id="button_new_mesocycle_cancel" class="center cancel" translation="value|cancel">
                    <div class="new_messocycle_preset_container">
                        <input type="button" class="button_new_mesocycle_save_preset center" translation="value|save_preset" disabled>
                        <input type="button" class="button_new_mesocycle_load_preset center" translation="value|load_preset" disabled>
                    </div>
                    <input type="button" id="button_new_mesocycle_next" class="center" translation="value|next" disabled>
                </div>
            </form>
            <form id="new_mesocycle_page2" class="hide container">
                <h1 translation="text|new_mesocycle" class="center"></h1>
                <ul id="exercise_list"></ul>
                <div class="footer">
                    <input type="button" id="button_new_mesocycle_back" class="center" translation="value|back">
                    <div class="new_messocycle_preset_container">
                        <input type="button" class="button_new_mesocycle_save_preset center" translation="value|save_preset">
                        <input type="button" class="button_new_mesocycle_load_preset center" translation="value|load_preset">
                    </div>
                    <input type="button" id="button_new_mesocycle_accept" class="center accept" translation="value|accept" disabled>
                </div>
            </form>
            <form id="container_mesocycle_page1" class="hide container">
                <h1 id="mesocycle_name" class="center"></h1>
                <ul id="microcycles_list"></ul>
                <div class="right">
                    <span id="mesocycle_current_microcycle"></span><span> MICROCICLOS DE </span>
                    <span id="mesocycle_total_microcycle"></span><span>, </span>
                    <span id="mesocycle_current_session"></span><span> SESIONES DE </span>
                    <span id="mesocycle_total_session"></span>
                </div>
                <div class="footer">
                    <input type="button" id="button_mesocycle_back_page1" class="center" translation="value|back">
                </div>
            </form>
            <form id="container_mesocycle_page2" class="hide container">
                <h1 translation="text|mesocycle_x" class="center">Mesociclo X</h1>
                <ul>
                    <li >
                        <p>Test</p>
                    </li>
                </ul>
                <div class="footer">
                    <input type="button" id="button_mesocycle_back_page2" class="center" translation="value|back">
                </div>
            </form>
        </div>
        <div id="container_modals">
            <div id="modal_presets" class="modal">
                <h2 translation="text|modal_presets_title"></h2>
                <div id="modal_presets_content"></div>
            </div>
        </div>
        <footer>
            <p translation="html|copyleft_text"></p>
        </footer>
    </body>
</html>
